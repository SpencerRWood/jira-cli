name: Windows foundation
on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --frozen --group dev
      - run: uv run pytest --cov=jira_cli --cov-report=term-missing
      - run: uv build
      - name: Verify PowerShell arguments without Jira requests
        shell: pwsh
        run: |
          uv run --frozen python -c 'import sys; from jira_cli.cli import parser; args=parser().parse_args(sys.argv[1:]); assert args.command=="watcher"; assert args.issue=="WWRAP-123"; assert args.watchers==("alice","bob")' watcher add --issue WWRAP-123 --watchers 'alice, bob'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen python -c 'import sys; from jira_cli.cli import parser; args=parser().parse_args(sys.argv[1:]); assert args.epic=="WWRAP-100"' story list --epic WWRAP-100
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen python -c 'import sys; from jira_cli.cli import parser; args=parser().parse_args(sys.argv[1:]); assert args.no_epic' create story --summary 'Fixture title' --no-epic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen python -c 'import sys; from jira_cli.cli import parser; args=parser().parse_args(sys.argv[1:]); assert args.command=="assign"; assert args.issue=="WWRAP-123"' assign --issue WWRAP-123
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen python -c 'import sys; from jira_cli.cli import parser; args=parser().parse_args(sys.argv[1:]); assert args.top==3; assert args.no_review' my today --top 3 --no-review
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen python -c 'import sys; from jira_cli.cli import parser; args=parser().parse_args(sys.argv[1:]); assert args.all' my today --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen python -c 'import sys; from jira_cli.cli import parser; args=parser().parse_args(sys.argv[1:]); assert args.text=="Review @alice"; assert args.mention==["bob","alice"]' comment add 'Review @alice' --mention bob --mention alice --issue WWRAP-123
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $description = @'
          First fixture line with "quotes" and an apostrophe's value.
          Second fixture line with a literal `backtick` and spaces.
          '@
          $env:JIRA_CLI_TEST_DESCRIPTION = $description
          try {
            foreach ($kind in @('story', 'epic')) {
              uv run --frozen python -c 'import sys; from jira_cli.cli import parser; args=parser().parse_args(sys.argv[1:]); assert args.watchers==("alice","bob")' create $kind --watchers 'alice, bob,alice'
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              uv run --frozen python -c 'import os,sys; from jira_cli.cli import parser; args=parser().parse_args(sys.argv[1:]); assert args.command=="create"; assert args.description==os.environ["JIRA_CLI_TEST_DESCRIPTION"]; assert args.summary=="Fixture title"' create $kind --summary 'Fixture title' --description $description --non-interactive
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } finally {
            Remove-Item Env:JIRA_CLI_TEST_DESCRIPTION
          }
      - name: Verify global installation and PowerShell entrypoint
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          uv tool install --python 3.14 $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $jira = Join-Path (uv tool dir --bin) 'jira.exe'
          & $jira --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $jira report --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $jira story view --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $jira completion powershell | Out-String | Invoke-Expression
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = @{
            'jira ep' = 'epic'
            'jira ass' = 'assign'
            'jira assign --iss' = '--issue'
            'jira epic v' = 'view'
            'jira my today --sort p' = 'priority'
            'jira my today --to' = '--top'
            'jira my today --no-r' = '--no-review'
            'jira comment add --men' = '--mention'
            'jira --project WWRAP epic list --with' = '--with-my-stories'
            'jira report daily --format c' = 'csv'
            'jira story v' = 'view'
            'jira story list --ep' = '--epic'
            'jira create story --no-e' = '--no-epic'
            'jira create story --wat' = '--watchers'
            'jira watcher a' = 'add'
            'jira watcher add --wat' = '--watchers'
            'jira create story --desc' = '--description'
          }
          foreach ($line in $cases.Keys) {
            $matches = (TabExpansion2 $line $line.Length).CompletionMatches.CompletionText
            if ($cases[$line] -notin $matches) {
              throw "Completion failed for $line"
            }
          }
